<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f1117">
<link rel="manifest" href="manifest.webmanifest">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Skull King">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>Skull King</title>
<meta name="description" content="Skull King scorekeeper, bid advisor and a full game against computer pirates.">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="stylesheet" href="css/table.css?v=11">
<link rel="stylesheet" href="css/app.css?v=11">
<link rel="stylesheet" href="css/coach.css?v=11">
<link rel="stylesheet" href="css/profile.css?v=11">
</head>
<body>
<div class="app" id="app">
  <header class="top">
    <div class="brand"><span class="brand-mark" id="brandMark"></span><span>Skull King</span></div>
    <div class="top-actions" id="topActions"></div>
  </header>

  <nav class="tabs" id="tabs" aria-label="Sections">
    <button data-tab="score" aria-label="Score"><svg viewBox="0 0 24 24"><path d="M5 4h14v16H5z M8 8h8 M8 12h8 M8 16h5"/></svg><span>Score</span></button>
    <button data-tab="bid" aria-label="Bid advisor"><svg viewBox="0 0 24 24"><path d="M4 20V10 M10 20V4 M16 20v-7 M22 20H2"/></svg><span>Bid</span></button>
    <button data-tab="play" aria-label="Play"><svg viewBox="0 0 24 24"><path d="M7 3h10a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z M12 8l3 4-3 4-3-4z"/></svg><span>Play</span></button>
    <button data-tab="settings" aria-label="Settings"><svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 1 0 0-6 3 3 0 0 0 0 6z M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg><span>Settings</span></button>
  </nav>

  <main id="main">
    <section class="view" id="v-score"></section>
    <section class="view" id="v-bid"></section>
    <section class="view" id="v-play"></section>
    <section class="view" id="v-settings"></section>
  </main>
</div>

<div class="sheet-back" id="sheetBack" hidden><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="pop" id="pop" hidden></div>
<div class="toast" id="toast" hidden></div>

<script src="js/engine.js?v=11"></script>
<script src="js/ai.js?v=11"></script>
<script src="js/art.js?v=11"></script>
<script src="js/skgame.js?v=11"></script>
<script src="js/fx.js?v=11"></script>
<script src="js/sfx.js?v=11"></script>
<script src="js/table.js?v=11"></script>
<script src="js/coach.js?v=11"></script>
<script src="js/skcoach.js?v=11"></script>
<script src="js/profile.js?v=11"></script>
<script src="js/skprofile.js?v=11"></script>
<script src="js/pwa.js?v=11" data-version="11"></script>
<script src="js/app.js?v=11"></script>
</body>
</html>
